
services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/tmp/kafka-logs
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 15

  mongodb:
    image: mongo:7
    container_name: rutasur-mongodb
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand('ping').ok
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-init:
    image: mongo:7
    volumes:
      - ./docker/init-mongo.sh:/init-mongo.sh:ro
    entrypoint:
      - /bin/sh
      - /init-mongo.sh
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"

  kafka-init:
    image: apache/kafka:3.9.1
    volumes:
      - ./docker/init-kafka.sh:/init-kafka.sh:ro
    entrypoint:
      - /bin/bash
      - /init-kafka.sh
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  proyector:
    build:
      context: ./servicios/proyector
      dockerfile: ../../Dockerfile.backend
    environment:
      KAFKA_BROKER: kafka:9092
      MONGO_URL: mongodb://mongodb:27017/?replicaSet=rs0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully

  notificaciones:
    build:
      context: ./servicios/notificaciones
      dockerfile: ../../Dockerfile.backend
    environment:
      KAFKA_BROKER: kafka:9092
      MONGO_URL: mongodb://mongodb:27017/?replicaSet=rs0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully

  reprogramacion:
    build:
      context: ./servicios/reprogramacion
      dockerfile: ../../Dockerfile.backend
    environment:
      KAFKA_BROKER: kafka:9092
      MONGO_URL: mongodb://mongodb:27017/?replicaSet=rs0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully

  monitor-sla:
    build:
      context: ./servicios/monitor-sla
      dockerfile: ../../Dockerfile.backend
    environment:
      KAFKA_BROKER: kafka:9092
      MONGO_URL: mongodb://mongodb:27017/?replicaSet=rs0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully

  analitica:
    build:
      context: ./servicios/analitica
      dockerfile: ../../Dockerfile.backend
    environment:
      KAFKA_BROKER: kafka:9092
      MONGO_URL: mongodb://mongodb:27017/?replicaSet=rs0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
      KAFKA_BROKER: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully

  reprocesamiento:
    build:
      context: ./servicios/reprocesamiento
      dockerfile: ../../Dockerfile.backend
    environment:
      KAFKA_BROKER: kafka:9092
      MONGO_URL: mongodb://mongodb:27017/?replicaSet=rs0
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo-init:
        condition: service_completed_successfully
    profiles:
      - reprocesamiento

volumes:
  kafka_data:
  mongodb_data: